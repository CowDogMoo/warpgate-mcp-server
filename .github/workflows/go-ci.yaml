---
name: Go CI

on:
  merge_group:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  schedule:
    # Run once a week (see https://crontab.guru)
    - cron: "0 0 * * 0"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  go-ci:
    uses: CowDogMoo/renovate-config/.github/workflows/go-ci.yaml@f5190ad1188e33e5c1ed9f2cebc5de3391f8be93 # main
    permissions:
      contents: read
    with:
      # warpgate@main needs a newer Go than go.mod's minimum.
      go-version: "1.27"
      # The CLI parity test shells out to the warpgate binary.
      test-go-installs: github.com/cowdogmoo/warpgate/v3/cmd/warpgate@main
